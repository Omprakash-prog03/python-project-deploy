# Render blueprint — see https://render.com/docs/blueprint-spec
#
# Free tier: no disk, so everything lives on the container's ephemeral
# filesystem under /app/storage (created and owned by the image). The service
# sleeps after ~15 minutes of inactivity and cold-starts in well under a minute;
# data is lost on redeploy, so the demo re-seeds itself on every wake-up.
#
# Do not set PORT here. Render injects its own and routes to it; pinning 8000
# makes the app bind a port the platform is not watching.
#
# The image's entrypoint creates the schema only, then hands over to uvicorn.
# Demo seeding and the glyph bank build run on a background thread *after* the
# port is bound — see app/services/bootstrap.py. Seeding used to run before the
# port was bound and took ~15 minutes of real OCR on free-tier CPU, which is
# what made deploys fail with "no open ports detected".
#
# To upgrade to a paid instance: set plan: starter, restore the `disk:` block
# below, point DATABASE_URL/STORAGE_DIR/MODEL_CACHE_DIR at /var/data, and add a
# managed Postgres (`DATABASE_URL` with postgresql+psycopg://) before raising
# WEB_CONCURRENCY — SQLite allows a single writer.
services:
  - type: web
    name: platevision
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/storage/platevision.db
      - key: STORAGE_DIR
        value: /app/storage/uploads
      - key: MODEL_CACHE_DIR
        value: /app/storage/models
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ALLOW_DEMO_LOGIN
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: BOOTSTRAP_ON_START
        value: "false"
      # SQLite permits one writer; scale with a managed Postgres before raising
      # this (the container forces 1 worker for SQLite regardless).
      - key: WEB_CONCURRENCY
        value: "1"
    # disk:
    #   name: platevision-data
    #   mountPath: /var/data
    #   sizeGB: 5
