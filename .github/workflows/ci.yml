name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Unit and API tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55

      - name: Recognition accuracy gate
        run: python scripts/eval_alpr.py

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: platevision/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name pv -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=ci-secret-key-that-is-long-enough-123 \
            -e SEED_DEMO_DATA=false \
            platevision/api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/api/v1/health | head -c 400
          docker logs pv | tail -20
          docker rm -f pv
