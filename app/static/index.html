<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3EFE5" />
<title>PlateVision · Plate Intelligence</title>
<meta name="description" content="Licence-plate recognition, watchlist enforcement and evidence review — running on your own infrastructure." />
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/static/fonts/CormorantGaramond-Light.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/static/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ================================ SIGN IN ================================ -->
<section class="auth" id="auth-screen">
  <header class="auth-bar">
    <div class="brand"><span class="brand-glyph" aria-hidden="true"></span>PLATEVISION</div>
    <div class="micro muted">PLATE INTELLIGENCE · 1.0</div>
  </header>

  <div class="auth-grid">
    <form class="auth-card" id="login-form" autocomplete="on">
      <div class="eyebrow"><span class="dot"></span>SECURE ACCESS</div>
      <h1 class="display">Every&nbsp;plate,<br /><em>seen clearly.</em></h1>
      <p class="lede" id="auth-sub">Sign in to your traffic operations workspace.</p>

      <label class="field">
        <span class="micro">WORK EMAIL</span>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="you@authority.gov" required />
      </label>

      <label class="field">
        <span class="micro">PASSWORD</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </label>

      <button class="pill pill-dark pill-block" type="submit" id="login-btn">ENTER · WORKSPACE</button>

      <div class="auth-hint hidden" id="auth-hint">
        <span class="micro muted" id="auth-hint-copy"></span>
        <button class="pill pill-ghost pill-block" type="button" id="demo-login-btn">USE · DEMO WORKSPACE</button>
      </div>

      <p class="auth-note micro">LOCAL INFERENCE · NO FRAME LEAVES YOUR NETWORK</p>
    </form>

    <aside class="auth-aside" aria-hidden="true">
      <figure class="photo-card">
        <div class="photo-head">
          <span class="micro"><span class="dot"></span>READY · FRAME 01</span>
          <span class="micro muted">VC-SNAP-0421</span>
        </div>
        <div class="photo-body">
          <img src="/static/img/hero-plate.jpg" alt="" />
        </div>
        <div class="photo-foot">
          <span class="micro">F/2.0 · 1/120s</span>
          <span class="micro">+0.0 EV</span>
        </div>
      </figure>
      <div class="aside-meta">
        <span class="micro muted">JPG · PNG · WEBP</span>
        <span class="micro muted">UP TO 12 MB</span>
      </div>
    </aside>
  </div>
</section>

<!-- ================================== APP ================================== -->
<div class="shell hidden" id="app-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-glyph" aria-hidden="true"></span>PLATEVISION</div>
    <div class="status micro"><span class="dot"></span>LIVE · <span id="corridor-label">MERIDIAN CORRIDOR</span></div>
    <div class="top-right">
      <span class="micro muted" id="user-label">—</span>
      <button class="pill pill-ghost pill-sm" data-action="logout">EXIT</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="tab is-active" data-view="overview">OVERVIEW</button>
    <button class="tab" data-view="scan">SCAN</button>
    <button class="tab" data-view="library">EVIDENCE</button>
    <button class="tab" data-view="watchlist">WATCHLIST</button>
  </nav>

  <main class="view" id="view"></main>

  <footer class="page-foot micro muted">
    <span>PLATEVISION · <span id="foot-version">1.0.0</span></span>
    <span id="foot-env">—</span>
  </footer>
</div>

<div id="modal-root"></div>

<input type="file" id="file-picker" accept="image/jpeg,image/png,image/webp,image/bmp" hidden />
<script src="/static/js/app.js" defer></script>
</body>
</html>
