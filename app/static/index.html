<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>PlateVision</title>
<meta name="description" content="Live licence-plate scanning. Point, shoot, read, export." />
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>

<!-- ══════════════════════════════════════════════════════════ CAMERA ══ -->
<main class="camera" id="camera">

  <header class="cam-bar">
    <button class="glass-btn" data-action="toggle-torch" id="torch-btn" aria-label="Torch" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M13 2 4.6 13.4H11l-1.2 8.6L18.6 10.6H12l1-8.6Z"/></svg>
    </button>

    <div class="masthead">
      <span class="wordmark" aria-label="PlateVision">PlateVision</span>
      <span class="status-line" id="cam-status">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">STANDBY</span>
      </span>
    </div>

    <button class="glass-btn" data-action="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg>
    </button>
  </header>

  <section class="viewfinder" id="viewfinder" aria-label="Camera viewfinder">
    <video id="cam" playsinline muted autoplay></video>
    <img class="still" id="still" src="/static/img/hero-plate.jpg" alt="" />
    <canvas id="snapshot" hidden></canvas>

    <div class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <div class="vf-hint" id="vf-hint">
      <span>Align the plate in frame</span>
    </div>

    <div class="vf-readout" id="vf-readout" hidden>
      <span class="readout-plate" id="readout-plate">—</span>
      <span class="readout-conf" id="readout-conf">—</span>
    </div>

    <div class="vf-progress" id="vf-progress" hidden><span></span></div>

    <button class="ghost-pill" data-action="import" id="import-pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="6.2" width="18.8" height="13.6" rx="4.2"/><circle cx="12" cy="13" r="4"/><path d="M8.6 6.2 10 3.6h4l1.4 2.6"/></svg>
      <span>Import a photo</span>
    </button>
  </section>

  <section class="cam-controls">
    <div class="jurisdiction-row" id="jurisdiction-row" role="group" aria-label="Jurisdiction">
      <button class="zoom-pill" data-country="IN">IN</button>
      <button class="zoom-pill" data-country="US">US</button>
      <button class="zoom-pill" data-country="UK">UK</button>
      <button class="zoom-pill" data-country="EU">EU</button>
      <button class="zoom-pill" data-country="GENERIC">ANY</button>
    </div>

    <div class="transport" id="mode-row" role="tablist" aria-label="Capture mode">
      <button class="transport-key" data-mode="photo" role="tab" aria-label="Photo" aria-selected="false">
        <svg viewBox="0 0 24 24"><rect x="2.6" y="6.2" width="18.8" height="13.6" rx="4.2"/><circle cx="12" cy="13" r="4"/><path d="M8.6 6.2 10 3.6h4l1.4 2.6"/></svg>
      </button>
      <button class="transport-key is-active" data-mode="scan" role="tab" aria-label="Scan" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M3.4 8V5.4A1.9 1.9 0 0 1 5.3 3.5H8M16 3.5h2.7a1.9 1.9 0 0 1 1.9 1.9V8M20.6 16v2.6a1.9 1.9 0 0 1-1.9 1.9H16M8 20.5H5.3a1.9 1.9 0 0 1-1.9-1.9V16M3.4 12h17.2"/></svg>
      </button>
      <button class="transport-key" data-mode="import" role="tab" aria-label="Import" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M12 16.4V3.8M7.4 8.2 12 3.6l4.6 4.6"/><path d="M4.2 15.2v3.4a2 2 0 0 0 2 2h11.6a2 2 0 0 0 2-2v-3.4"/></svg>
      </button>
    </div>

    <div class="shutter-row">
      <button class="thumb-btn" data-action="open-history" aria-label="Scan history">
        <img id="last-thumb" src="/static/img/hero-plate.jpg" alt="" />
        <span class="thumb-count" id="scan-count" hidden>0</span>
      </button>

      <button class="shutter" id="shutter" aria-label="Capture">
        <span class="shutter-inner"></span>
      </button>

      <button class="flip-btn" data-action="flip-camera" aria-label="Switch camera">
        <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 13.3-4.1L20 7.5M20 15a8 8 0 0 1-13.3 4.1L4 16.5"/><path d="M20 3.5v4h-4M4 20.5v-4h4"/></svg>
      </button>
    </div>

    <div class="timeline">
      <div class="filmstrip" id="filmstrip" role="list" aria-label="Recent scans"></div>
      <div class="timeline-meta">
        <span id="film-oldest">—</span>
        <span class="timeline-hint">‹‹ swipe history ››</span>
        <span id="film-newest">—</span>
      </div>
    </div>
  </section>

  <nav class="dock" aria-label="History">
    <button class="dock-round" data-action="open-history" aria-label="Open history">
      <svg viewBox="0 0 24 24"><path d="M8.6 6.6h12.2M8.6 12h12.2M8.6 17.4h12.2"/><circle cx="4.2" cy="6.6" r="1.15"/><circle cx="4.2" cy="12" r="1.15"/><circle cx="4.2" cy="17.4" r="1.15"/></svg>
    </button>

    <div class="dock-pill">
      <span class="dock-favicon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.6" y="6.2" width="18.8" height="13.6" rx="4.2"/><circle cx="12" cy="13" r="4"/><path d="M8.6 6.2 10 3.6h4l1.4 2.6"/></svg>
      </span>
      <span class="dock-title" id="dock-title">PlateVision</span>
      <button class="dock-refresh" data-action="refresh" aria-label="Rescan">
        <svg viewBox="0 0 24 24"><path d="M19.4 12a7.4 7.4 0 1 1-2.2-5.3"/><path d="M19.8 4.2v4.6h-4.6"/></svg>
      </button>
    </div>

    <button class="dock-square" data-action="import" aria-label="Import a photo">
      <svg viewBox="0 0 24 24"><rect x="3.2" y="6.6" width="12.4" height="12.4" rx="3.2"/><path d="M8.6 3.4h9.2a2.8 2.8 0 0 1 2.8 2.8v9.2"/></svg>
    </button>
  </nav>
</main>

<!-- ═══════════════════════════════════════════════════════════ SHEETS ══ -->
<div class="sheet-layer" id="sheet-layer" hidden>
  <div class="sheet-scrim" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail"></div>
</div>

<div class="toast-layer" id="toast-layer" aria-live="polite"></div>

<input type="file" id="file-picker" accept="image/jpeg,image/png,image/webp,image/bmp" hidden />
<script src="/static/js/app.js" defer></script>
</body>
</html>
