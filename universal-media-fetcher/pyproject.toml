[project]
name = "universal-media-fetcher"
version = "0.1.0"
description = "Capability-aware media identification across 21 platforms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter
  "B008",    # FastAPI dependency defaults
  "SIM108",
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"umf/adapters/*" = ["N801"]  # adapter classes mirror platform names
